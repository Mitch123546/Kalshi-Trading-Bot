[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kalshi-commodity-bot"
version = "0.1.0"
description = "Research-first paper/live framework for Kalshi 15-minute commodity markets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "cryptography>=42.0",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
ml = ["torch>=2.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
kalshi-bot = "kalshi_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
